services:
  api:
    build:
      context: ./backend
      dockerfile: ./docker/Dockerfile
    container_name: schedule_api
    ports:
      - "8080:80"
    # No bind mount on purpose: the image carries the source and the vendor
    # install, so a fresh clone comes up with `docker compose up` alone.
    # For editing the code with reload, see "Sem Docker" in the README.
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: ./docker/Dockerfile
    container_name: schedule_web
    ports:
      - "3000:80"
    depends_on:
      - api

  db:
    image: postgres:15-alpine
    container_name: schedule_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: schedule_visits
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The API connects while booting, so it has to wait for Postgres to accept
      # connections and not merely for the container to exist
      test: ["CMD-SHELL", "pg_isready -U postgres -d schedule_visits"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
