services:
  api:
    build:
      context: ./backend
      dockerfile: ./docker/Dockerfile
    container_name: schedule_api
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    depends_on:
      - db

  web:
    build:
      context: ./frontend
      dockerfile: ./docker/Dockerfile
    container_name: schedule_web
    ports:
      - "3000:80"
    depends_on:
      - api

  db:
    image: postgres:15-alpine
    container_name: schedule_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: schedule_visits
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
